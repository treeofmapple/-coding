[package]
name = "comparative"
version = "1.0.0"
description = ""
edition = "2024"
publish = false

[[bin]]
name = "comparative"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
hyper = "1.8.1"
reqwest = "0.12.24"
regex = "1.12.2"
actix-web = "4.12.0"
bytes = "1.11.0"
url = "2.5.7"
bb8 = "0.9.0"
thiserror = "2.0.17"
serde = "1.0.228"
serde_yaml = "0.9.34"
clap = { version = "4.5.51", features = ["derive"] }
tower-http = { version = "0.6.6", features = ["timeout", "trace", "request-id"] }
