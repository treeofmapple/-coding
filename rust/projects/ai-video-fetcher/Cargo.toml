[package]
name = "ai-video-fetcher"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
google-auth = "0.10"

[profile.release]
strip = true
opt-level = 3

lto = true
codegen-units = 1
panic = 'abort'
